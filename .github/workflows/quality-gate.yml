name: quality-gate

on:
  push:
    branches:
      - custom/local-friend-deployment
      - marketplace/stable-prep
  pull_request:
    branches:
      - marketplace/stable-prep

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run release:verify

